name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Build package
        run: pnpm build

      - name: Upload built package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Validate package exports and types
        run: pnpm package:check

      - name: Enforce bundle budget
        run: pnpm size:check

      - name: Find dead code and unused dependencies
        run: pnpm deadcode

      - name: Audit dependencies
        run: pnpm security:audit

  node-20:
    name: Built package on Node 20
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out package metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.19.0

      - name: Download built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-dist
          path: dist

      - name: Import and exercise the ESM bundle
        run: |
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import { fromDecimal, toDecimalString } from "./dist/core/index.js";

          const result = fromDecimal("12.50", "CHF");
          assert.equal(result.ok, true);
          assert.equal(toDecimalString(result.value), "12.50");
          EOF
